spring.application.name=messaging
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/messaging
spring.datasource.username=root
spring.datasource.password=Test2323
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# Eureka Configuration
eureka.instance.hostname=localhost
spring.cloud.inetutils.preferred-networks=127.0.0.1
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Configurations
spring.kafka.consumer.group-id=messaging-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservicesproject.messaging.event
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.microservicesproject.messaging.event.SendMessageEvent

# Producer Configurations
spring.kafka.template.default-topic=messages
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.microservicesproject.messaging.event.SendMessageEvent

#Sleuth and Zipkin properties
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
