spring.application.name=messaging
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/messaging
spring.datasource.username=root
spring.datasource.password=Test2323
server.port=0

eureka.client.service-url.defaultzone=http://localhost:8763/eureka

#Kafka Broker URL
spring.kafka.bootstrap-servers=localhost:9092
#Consumer Group ID (for consuming messages)
spring.kafka.consumer.group-id=messaging-group
#Enable automatic topic creation
spring.kafka.admin.auto-create=true
#Producer Configurations
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
#Consumer Configurations
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

##Keycloak settings
keycloak.realm=MessagingAppRealm
keycloak.auth-server-url=http://localhost:8181
keycloak.resource=messaging-service
keycloak.credentials.secret=YOUR_CLIENT_SECRET
keycloak.bearer-only=true

spring.security.oauth2.resourceserver.jwt.jwt-set-uri=http://localhost8181/realms/MessagingAppRealm/protocol/openid-connect/certs